name: Codex Apply Changes

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should Codex implement?"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  codex-apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Write runtime prompt
        shell: bash
        run: |
          mkdir -p .github/codex/runtime
          cat > .github/codex/runtime/prompt.md <<EOF
          You are modifying this ERP/MES repository.

          Follow the repository rules in AGENTS.md.
          Reuse existing architecture and conventions.
          Do not rewrite unrelated modules.
          Make focused, production-safe changes only.

          Task:
          ${{ github.event.inputs.task }}
          EOF

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/runtime/prompt.md
          output-file: codex-output.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--full-auto"]'

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch name
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          echo "name=codex/$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.branch.outputs.name }}"
          git add -A
          git commit -m "Codex: ${{ github.event.inputs.task }}"

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const head = '${{ steps.branch.outputs.name }}';
            const base = context.payload.repository.default_branch;
            const title = `Codex: ${{ github.event.inputs.task }}`.slice(0, 240);

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head,
              base,
              body: [
                "Automated Codex patch.",
                "",
                `Task: ${{ github.event.inputs.task }}`,
                "",
                "Please review before merging."
              ].join("\n")
            });

      - name: Fail if no changes
        if: steps.changes.outputs.changed != 'true'
        shell: bash
        run: |
          echo "Codex completed but did not produce file changes."
          exit 1

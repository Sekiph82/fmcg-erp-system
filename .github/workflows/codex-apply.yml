name: Codex Auto Apply

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"

  workflow_dispatch:
    inputs:
      task:
        description: "Optional manual task override"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-auto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build task
        id: task
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.task }}" ]; then
            TASK="${{ github.event.inputs.task }}"
          else
            TASK="Inspect the latest changes on branch ${GITHUB_REF_NAME} and continue implementing the Utilities Module incrementally using existing project conventions. Focus on the next logical unfinished part. Preserve architecture, avoid unrelated refactors, and produce reviewable changes."
          fi

          {
            echo "task<<EOF"
            echo "$TASK"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write runtime prompt
        shell: bash
        run: |
          mkdir -p .github/codex/runtime
          cat > .github/codex/runtime/prompt.md <<EOF
          You are modifying this ERP/MES repository.

          Follow AGENTS.md strictly.
          Reuse existing architecture and conventions.
          Do not rewrite unrelated modules.
          Make focused, production-safe changes only.

          Before coding:
          - inspect the current repository state
          - inspect recent changed files from the triggering push if relevant
          - identify the next logical unfinished Utilities Module task

          Task:
          ${{ steps.task.outputs.task }}
          EOF

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/runtime/prompt.md
          output-file: codex-output.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--full-auto"]'

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch name
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          echo "name=codex/auto-${TS}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.branch.outputs.name }}"
          git add -A
          git commit -m "Codex: automated utilities module continuation"

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const head = '${{ steps.branch.outputs.name }}';
            const base = 'dev';

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Codex: automated Utilities Module continuation',
              head,
              base,
              body: [
                'Automated Codex patch triggered by push to `dev`.',
                '',
                `Source push SHA: ${context.sha}`,
                '',
                'Please review before merging.'
              ].join('\n')
            });

      - name: Finish with no-op notice
        if: steps.changes.outputs.changed != 'true'
        shell: bash
        run: |
          echo "Codex ran successfully but produced no file changes."

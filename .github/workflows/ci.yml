name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fmcg_erp
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d fmcg_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://erp_user:erp_password@localhost:5432/fmcg_erp
      SECRET_KEY: ci-secret-key-change-me-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_EMAIL: admin@ci.local
      INITIAL_ADMIN_PASSWORD: CiAdmin1234!
      INITIAL_ADMIN_FULL_NAME: CI Admin
      REDIS_URL: redis://localhost:6379/0
      SEED_INITIAL_ADMIN: "false"
      SEED_DEMO_DATA: "false"
      SYNC_INITIAL_ADMIN_PASSWORD: "false"
      AUTO_CREATE_TABLES: "false"
      RUN_MIGRATIONS_ON_STARTUP: "false"
      AUTH_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Compile Python
        working-directory: backend
        run: python -m compileall app
      - name: Import backend
        working-directory: backend
        run: python -c "import app.main; print('backend import ok')"
      - name: Bootstrap test DB and run migrations
        working-directory: backend
        run: python scripts/dev_migrate.py
      - name: Verify single Alembic head
        working-directory: backend
        run: |
          count=$(alembic heads 2>&1 | grep -c "(head)")
          if [ "$count" -ne 1 ]; then
            echo "ERROR: Expected 1 migration head, got $count"
            alembic heads
            exit 1
          fi
          echo "Single head confirmed."
      - name: Pytest
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency audit
        working-directory: frontend
        # --audit-level=critical: next@14.2.35 patches all critical CVEs.
        # Remaining HIGH CVEs are in next.js itself and require next@15+ to fix;
        # upgrading is a major breaking change deferred to a separate task.
        run: npm audit --audit-level=critical
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose env files
        run: |
          cp .env.development.example .env.development
          cp .env.production.example .env.production
      - name: Validate dev compose
        run: docker compose --env-file .env.development.example config
      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config
